ShortDescription: Serverless peer-to-peer terminal sharing over a punched p2p link
Description: >-
  Peer-to-peer terminal sharing with tmate-like semantics and no central server.
  A host shares a tmux session and a client joins it with a token passed
  out-of-band; rendezvous happens on the BitTorrent mainline DHT, connectivity
  is a direct ICE-hole-punched link, and the session is end-to-end SSH with the
  host key pinned in the token. Joining needs nothing extra; hosting also needs
  tmux (winget install arndawg.tmux-windows).
